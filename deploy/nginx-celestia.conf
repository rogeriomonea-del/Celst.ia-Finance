# nginx — celest.ia Finance + celest.ia Flights no mesmo VPS.
#
# Instale em /etc/nginx/sites-available/celestia e ative com:
#   ln -s /etc/nginx/sites-available/celestia /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Troque SEU_DOMINIO pelos domínios reais ANTES de rodar o certbot.
# O HTTPS é adicionado pelo certbot (`certbot --nginx`), que reescreve estes
# blocos incluindo os certificados — não edite as linhas de ssl_ à mão depois.

# Tamanho máximo de upload: extratos e faturas em PDF passam fácil de 1 MB.
client_max_body_size 20m;

# ---------------------------------------------------------------------------
# celest.ia Finance — Next.js (3000) + motor Python (8787)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name financas.SEU_DOMINIO.com.br;

    access_log /var/log/nginx/celestia-finance.access.log;
    error_log  /var/log/nginx/celestia-finance.error.log;

    # Cabeçalhos de segurança. Sem CSP rígida aqui porque o Next injeta scripts
    # inline com nonce próprio; o resto é seguro por padrão.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O motor Python responde direto, sem passar pelo Node — um salto a menos.
    # Precisa vir ANTES do location / para ganhar a precedência de prefixo.
    location /api/py/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importação de extrato grande pode demorar; o padrão de 60s é curto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Arquivos estáticos do Next com cache longo (o nome já tem hash).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# celest.ia Flights — build estático do Vite (celestia_dashboard/dist)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name voos.SEU_DOMINIO.com.br;

    root /opt/celestia/flights/celestia_dashboard/dist;
    index index.html;

    access_log /var/log/nginx/celestia-flights.access.log;
    error_log  /var/log/nginx/celestia-flights.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
