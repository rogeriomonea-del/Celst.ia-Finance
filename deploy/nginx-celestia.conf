# nginx — celest.ia Flights + celest.ia Finance no mesmo VPS.
#
# Topologia (troque os domínios no instalador, não aqui):
#   celestiaflights.com          → plataforma de voos (público; login do app
#                                  para as áreas que exigem conta)
#   www.celestiaflights.com      → idem
#   celestiaflights.cloud        → redireciona 301 para o .com
#   financas.celestiaflights.com → app financeiro (protegido pelo login do
#                                  próprio app: código por e-mail ou Google)
#
# Os dois hosts encaminham /api/py/ para o MESMO motor Python (127.0.0.1:8787).
# É ele quem emite o cookie de sessão `celestia_sessao` com
# Domain=.celestiaflights.com — assim uma única sessão vale nas duas
# plataformas (SSO). Não há mais auth_basic/htpasswd: a proteção é feita pelo
# login do app (middleware do Next + motor), e o htpasswd antigo em
# /etc/celestia não é mais usado.
#
# Instale em /etc/nginx/sites-available/celestia e ative com:
#   ln -s /etc/nginx/sites-available/celestia /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# O HTTPS é adicionado depois pelo certbot (`certbot --nginx`), que reescreve
# estes blocos incluindo os certificados.

# Extratos e faturas em PDF passam fácil de 1 MB.
client_max_body_size 20m;

# ---------------------------------------------------------------------------
# celestiaflights.cloud → 301 para o .com
# Um domínio só é o canônico: evita conteúdo duplicado no Google e mantém a
# marca protegida sem manter dois sites iguais no ar.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_ALIAS www.DOMINIO_ALIAS;

    return 301 https://DOMINIO_FLIGHTS$request_uri;
}

# ---------------------------------------------------------------------------
# celest.ia Flights — build estático do Vite (público)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_FLIGHTS www.DOMINIO_FLIGHTS;

    root /opt/celestia/flights/celestia_dashboard/dist;
    index index.html;

    access_log /var/log/nginx/celestia-flights.access.log;
    error_log  /var/log/nginx/celestia-flights.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Login e sessão: a SPA fala com o mesmo motor Python do app financeiro
    # (/api/py/auth/*), same-origin, para o cookie de sessão viajar sozinho.
    # Precisa vir antes do location / para ganhar a precedência de prefixo.
    location /api/py/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aqui só passam chamadas curtas (login, sessão) — timeout padrão basta.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# celest.ia Finance — Next.js (3000) + motor Python (8787)
#
# ATENÇÃO: este host expõe patrimônio, extratos bancários e faturas. Quem
# protege é o login do próprio app: o middleware do Next redireciona para
# /entrar quem não tem o cookie de sessão, e o motor Python recusa (401) toda
# rota de dados sem sessão válida. Contas novas nascem inativas até um
# administrador aprovar em /admin.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_FINANCE;

    access_log /var/log/nginx/celestia-finance.access.log;
    error_log  /var/log/nginx/celestia-finance.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Dados financeiros não devem aparecer em buscador nenhum.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # O motor Python responde direto, sem passar pelo Node — um salto a menos.
    # Precisa vir antes do location / para ganhar a precedência de prefixo.
    location /api/py/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importação de extrato grande demora mais que o padrão de 60s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Estáticos do Next com cache longo (o nome já carrega hash).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Qualquer outro nome (inclusive o IP direto) não serve nada.
# Sem isso, o primeiro server block viraria o padrão e o app financeiro
# responderia para quem varresse o IP.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
